<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'ANSWER_STRUCTURE.TITLE' | translate: { id: question?.id } }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <h1 class="content">
      {{ question?.name }}
      <ion-icon id="hover-trigger" class="question-icon" name="information-circle-outline"></ion-icon>
    </h1>

    <ion-popover trigger="hover-trigger" triggerAction="click">
      <ng-template>
        <ion-content class="ion-padding">{{ 'ANSWER_STRUCTURE.HINT' | translate }}</ion-content>
      </ng-template>
    </ion-popover>

    <br>
      <br>

        @for (step of question?.structure; track step) {
          <ion-item
            class="step"
            lines="none"
            detail="false"
            >
            <ion-label>{{ step?.name }}</ion-label>
            <ion-checkbox [(ngModel)]="step.isChecked" slot="end" color="success"></ion-checkbox>
          </ion-item>
        }

        <br>

          <ion-button (click)="saveResult()" color="tertiary" fill="outline" expand="block" size="large">
            {{ 'ANSWER_STRUCTURE.SAVE' | translate }}
          </ion-button>
        </div>
      </ion-content>
