<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/profile" [text]="'COMMON.BACK' | translate"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'HOW_TO_LEARN.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="container">
    <h1 class="hero">{{ 'HOW_TO_LEARN.HERO' | translate }}</h1>
    <p class="intro">{{ 'HOW_TO_LEARN.INTRO' | translate }}</p>

    @for (step of steps; track step.titleKey) {
      <div class="step-card">
        <div class="step-card__icon step-card__icon--{{ step.color }}">
          <ion-icon [name]="step.icon" aria-hidden="true"></ion-icon>
        </div>
        <div class="step-card__body">
          <h2 class="step-card__title">{{ step.titleKey | translate }}</h2>
          <p class="step-card__text">{{ step.textKey | translate }}</p>
        </div>
      </div>
    }

    <p class="outro">{{ 'HOW_TO_LEARN.OUTRO' | translate }}</p>
  </div>
</ion-content>
